<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d6e"/>
      <stop offset="0.5" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffc21a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14123a"/>
      <stop offset="0.35" stop-color="#3a2fb8"/>
      <stop offset="0.6" stop-color="#5b4bff"/>
      <stop offset="1" stop-color="#14123a"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e6ff"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe2a8"/>
      <stop offset="1" stop-color="#e7a85a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- raios de energia -->
  <g fill="#ffffff" opacity="0.16">
    <path d="M512 560 L120 0 L330 0 Z"/><path d="M512 560 L620 0 L820 0 Z"/><path d="M512 560 L1024 140 L1024 360 Z"/>
    <path d="M512 560 L0 300 L0 520 Z"/><path d="M512 560 L1024 760 L1024 960 Z"/><path d="M512 560 L0 820 L0 1024 L120 1024 Z"/>
  </g>
  <circle cx="512" cy="560" r="430" fill="url(#glow)"/>
  <!-- notas musicais -->
  <g fill="#1b1350">
    <ellipse cx="452" cy="300" rx="56" ry="42" transform="rotate(-22 452 300)"/>
    <ellipse cx="588" cy="268" rx="56" ry="42" transform="rotate(-22 588 268)"/>
    <rect x="490" y="100" width="22" height="196"/><rect x="626" y="68" width="22" height="196"/>
    <path d="M490 100 L648 68 L648 112 L490 144 Z"/>
  </g>
  <!-- caixa -->
  <g transform="translate(512 700) scale(1.12) translate(-512 -700)">
    <ellipse cx="512" cy="820" rx="300" ry="96" fill="#14123a"/>
    <rect x="212" y="600" width="600" height="220" fill="url(#shell)"/>
    <!-- afinadores -->
    <g fill="#e8ecff">
      <rect x="262" y="640" width="26" height="140" rx="12"/><rect x="372" y="652" width="26" height="150" rx="12"/>
      <rect x="499" y="656" width="26" height="152" rx="12"/><rect x="626" y="652" width="26" height="150" rx="12"/>
      <rect x="736" y="640" width="26" height="140" rx="12"/>
    </g>
    <!-- aros -->
    <path d="M212 800 Q512 920 812 800 L812 834 Q512 954 212 834 Z" fill="#ffd23a"/>
    <ellipse cx="512" cy="600" rx="300" ry="96" fill="#ffd23a"/>
    <ellipse cx="512" cy="592" rx="282" ry="84" fill="url(#head)"/>
    <ellipse cx="512" cy="592" rx="282" ry="84" fill="none" stroke="#c9c2ff" stroke-width="6"/>
  </g>
  <!-- baquetas cruzadas -->
  <g stroke-linecap="round">
    <line x1="110" y1="300" x2="560" y2="580" stroke="#1b1350" stroke-width="74"/>
    <line x1="110" y1="300" x2="560" y2="580" stroke="url(#stick)" stroke-width="52"/>
    <circle cx="570" cy="586" r="38" fill="#fff3d6" stroke="#1b1350" stroke-width="9"/>
    <line x1="914" y1="300" x2="464" y2="580" stroke="#1b1350" stroke-width="74"/>
    <line x1="914" y1="300" x2="464" y2="580" stroke="url(#stick)" stroke-width="52"/>
    <circle cx="454" cy="586" r="38" fill="#fff3d6" stroke="#1b1350" stroke-width="9"/>
  </g>
  <!-- impacto -->
  <g fill="#ffffff">
    <path transform="translate(0 30) scale(1)" d="M512 470 l14 40 40 -10 -28 32 30 28 -42 -2 -14 40 -14 -40 -42 2 30 -28 -28 -32 40 10 z" opacity="0.95"/>
  </g>
</svg>
